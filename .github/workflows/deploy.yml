# Temporary diagnostic branch only. This workflow never builds or deploys Pages.
name: Inverse Linux diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '25.6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Capture numeric and fresh-fit evidence
        run: node scripts/inverse/ci-diagnostics.mjs
      - name: Replay portability assertions
        run: node --test --test-concurrency=1 scripts/inverse/trace-reuse.test.mjs scripts/inverse/datasets/synthetic-training.test.mjs scripts/inverse/datasets/synthetic-interventions.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-linux-node-${{ matrix.node }}
          path: tmp/ci-diagnostics
          retention-days: 3
