# Temporary diagnostic branch only. This workflow never builds or deploys Pages.
name: Inverse Linux diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture numeric and fresh-fit evidence
        if: matrix.shard == 1
        run: node scripts/inverse/ci-diagnostics.mjs
      - name: Replay inverse regressions
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 scripts/inverse/*.test.mjs scripts/inverse/datasets/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-linux-shard-${{ matrix.shard }}
          path: |
            tmp/ci-diagnostics
            tmp/inverse-fit-failures
          retention-days: 3
