# Temporary diagnostic branch only. This workflow never builds or deploys Pages.
name: Inverse Linux diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: full
        options: [full, cold, resources, retained-grid, source-resolution, return-repair, paper-finalists, paper-repair, budgets, remaining, bicycle, comparison, maple, polish, late-clearance, profile, shared-runtime]
        description: Full diagnostics or focused normal-budget regressions
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'cold') && '[1,2,3,4]' || '[1]') }}
        clock: ${{ fromJSON(inputs.mode == 'full' && '[1,0.5]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture numeric and fresh-fit evidence
        if: inputs.mode == 'full' && matrix.shard == 1 && matrix.clock == 1
        run: node scripts/inverse/ci-diagnostics.mjs
      - name: Replay inverse regressions
        if: inputs.mode == 'full'
        env:
          INVERSE_DIAGNOSTIC_CLOCK_RATE: ${{ matrix.clock }}
        run: node --import ./scripts/inverse/ci-clock.mjs --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 scripts/inverse/*.test.mjs scripts/inverse/datasets/*.test.mjs
      - name: Replay normal-budget partial-feature regressions
        if: inputs.mode == 'bicycle'
        run: node --test scripts/inverse/feature-finalists.test.mjs
      - name: Replay cold-process regressions without a diagnostic clock
        if: inputs.mode == 'cold'
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 scripts/inverse/*.test.mjs scripts/inverse/datasets/*.test.mjs
      - name: Replay simpler-layout and supported-count regressions
        if: inputs.mode == 'comparison'
        run: node --test --test-concurrency=1 scripts/inverse/comparison-search.test.mjs scripts/inverse/refinement-checkpoints.test.mjs scripts/inverse/supported-count-bound.test.mjs
      - name: Replay maple comparison regression
        if: inputs.mode == 'maple'
        run: node --test scripts/inverse/comparison-search.test.mjs
      - name: Replay bounded photographic cleanup regressions
        if: inputs.mode == 'polish'
        run: node --test --test-concurrency=1 scripts/inverse/deferred-routing.test.mjs scripts/inverse/late-cleanup.test.mjs scripts/inverse/clamped-features.test.mjs
      - name: Replay late clearance with failure capture
        if: inputs.mode == 'late-clearance'
        run: node --test scripts/inverse/clearance-feature-late.test.mjs
      - name: Observe CPU use during real-clock photo regressions
        if: inputs.mode == 'resources'
        run: node --import ./scripts/inverse/ci-resources.mjs --test --test-concurrency=1 scripts/inverse/interior-counts.test.mjs scripts/inverse/matching-seeds.test.mjs scripts/inverse/late-feature-initialization.test.mjs
      - name: Verify retained-grid priority and traced-feature fallbacks
        if: inputs.mode == 'retained-grid'
        run: node --test --test-concurrency=1 scripts/inverse/interior-counts.test.mjs scripts/inverse/weak-feature-routing.test.mjs scripts/inverse/feature-refinement.test.mjs scripts/inverse/deferred-routing.test.mjs scripts/inverse/short-budget-features.test.mjs scripts/inverse/matching-seeds.test.mjs scripts/inverse/kernel-choice.test.mjs scripts/inverse/clearance-feature-geometry.test.mjs
      - name: Verify source-resolution grid refinement and unchanged objectives
        if: inputs.mode == 'source-resolution'
        run: node --test --test-concurrency=1 scripts/inverse/interior-counts.test.mjs scripts/inverse/paper-resolution-finalist.test.mjs scripts/inverse/weighted-pipeline.test.mjs scripts/inverse/symmetry-fit.test.mjs scripts/inverse/feature-refinement.test.mjs scripts/inverse/weak-feature-routing.test.mjs
      - name: Verify cached return repair and fresh circular routing
        if: inputs.mode == 'return-repair'
        run: node --test --test-concurrency=1 scripts/inverse/short-return-audits.test.mjs scripts/inverse/self-return-projection.test.mjs scripts/inverse/final-return-repair.test.mjs scripts/inverse/curved-contact-recovery.test.mjs scripts/inverse/clearance-routing.test.mjs
      - name: Replay explicit fitting and paper verification allowances
        if: inputs.mode == 'budgets'
        run: node --test --test-concurrency=1 scripts/inverse/recovered-paper-candidate.test.mjs scripts/inverse/incomplete-paper-alternative.test.mjs scripts/inverse/clearance-feature-budget.test.mjs scripts/inverse/clearance-feature-late.test.mjs scripts/inverse/clearance-feature.test.mjs scripts/inverse/feature-finalists.test.mjs scripts/inverse/feature-near-miss.test.mjs scripts/inverse/weak-feature-routing.test.mjs scripts/inverse/paper-rollback.test.mjs scripts/inverse/late-cleanup.test.mjs
      - name: Verify retained paper alternatives at their actual lattice
        if: inputs.mode == 'paper-finalists'
        run: node --test --test-concurrency=1 scripts/inverse/paper-resolution-finalist.test.mjs scripts/inverse/recovered-paper-candidate.test.mjs scripts/inverse/incomplete-paper-alternative.test.mjs scripts/inverse/junction-routing.test.mjs scripts/inverse/clearance-routing.test.mjs
      - name: Verify bounded final paper repair and fresh photographic fits
        if: inputs.mode == 'paper-repair'
        run: node --test --test-concurrency=1 scripts/inverse/paper-repair-unused-budget.test.mjs scripts/inverse/geometric-material.test.mjs scripts/inverse/short-budget-features.test.mjs
      - name: Replay remaining short-budget fitting regressions
        if: inputs.mode == 'remaining'
        run: node --test --test-concurrency=1 scripts/inverse/coverage-recovery.test.mjs scripts/inverse/interior-counts.test.mjs scripts/inverse/matching-seeds.test.mjs scripts/inverse/clearance-feature-late.test.mjs scripts/inverse/clearance-feature.test.mjs scripts/inverse/feature-near-miss.test.mjs scripts/inverse/search-scheduling.test.mjs scripts/inverse/short-budget-features.test.mjs
      - name: Profile the normal-budget star fit
        if: inputs.mode == 'profile'
        run: |
          mkdir -p tmp/ci-profiles
          node --cpu-prof --cpu-prof-dir=tmp/ci-profiles --test --test-name-pattern='^hard-bibel-star-outline:' scripts/inverse/deferred-routing.test.mjs
      - name: Replay all regressions with a reused runtime and unchanged budgets
        if: inputs.mode == 'shared-runtime'
        run: node --experimental-test-isolation=none --test --test-concurrency=1 scripts/inverse/*.test.mjs scripts/inverse/datasets/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-linux-clock-${{ matrix.clock }}-shard-${{ matrix.shard }}
          path: |
            tmp/ci-diagnostics
            tmp/inverse-test-failures
            tmp/ci-profiles
          retention-days: 3
