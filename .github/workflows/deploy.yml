# Temporary diagnostic branch only. This workflow never builds or deploys Pages.
name: Inverse Linux diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: full
        options: [full, bicycle]
        description: Full comparison or one normal-budget bicycle reproduction
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mode == 'bicycle' && '[1]' || '[1,2,3,4]') }}
        clock: ${{ fromJSON(inputs.mode == 'bicycle' && '[1]' || '[1,0.5]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture numeric and fresh-fit evidence
        if: inputs.mode != 'bicycle' && matrix.shard == 1 && matrix.clock == 1
        run: node scripts/inverse/ci-diagnostics.mjs
      - name: Replay inverse regressions
        if: inputs.mode != 'bicycle'
        env:
          INVERSE_DIAGNOSTIC_CLOCK_RATE: ${{ matrix.clock }}
        run: node --import ./scripts/inverse/ci-clock.mjs --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 scripts/inverse/*.test.mjs scripts/inverse/datasets/*.test.mjs
      - name: Capture normal-budget bicycle failure
        if: inputs.mode == 'bicycle'
        run: node --test --test-name-pattern='lower-error finalist' scripts/inverse/feature-finalists.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-linux-clock-${{ matrix.clock }}-shard-${{ matrix.shard }}
          path: |
            tmp/ci-diagnostics
            tmp/inverse-test-failures
          retention-days: 3
