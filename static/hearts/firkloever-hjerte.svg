<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Firkløver-hjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Four-leaf clover heart</title>
  <desc xml:lang="da">Et lille firkløver af hjerter inde i et stort firkløver, med firkanter ind fra hjørnerne. Seks striber i hver halvdel, hvor de yderste er dobbelt så brede; klippene har buer, og det midterste er lige. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er ekspert. Flet de små hjerter i midten først, mens der stadig er plads til fingrene.</desc>
  <desc xml:lang="en">A small four-leaf clover of hearts inside a large one, with squares reaching in from the corners. Six strips in each half, the outermost twice as wide; the cuts carry arcs, and the middle one is straight. The halves mirror each other, so one template covers both, and the difficulty is expert. Weave the small hearts in the middle first, while there is still room for your fingers.</desc>
