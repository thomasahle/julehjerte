<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Bauhaus</title>
  <desc xml:lang="da">Halvcirkler og afrundede felter som på en Bauhaus-plakat. Hver halvcirkel er præcis lige så bred som et tern, så ternene smelter sammen til piller og buer. Fire striber i hver halvdel: den ene halvdel klippes med halvcirkler, den anden med lige snit, så der skal bruges to skabeloner. Sværhedsgraden er mellem; klip hver halvcirkel i ét træk, og drej papiret i stedet for saksen.</desc>
  <desc xml:lang="en">Half-circles and rounded fields, as on a Bauhaus poster. Each half-circle is exactly as wide as a square, so the squares join into pills and arches. Four strips in each half: one half is cut with half-circles, the other with straight cuts, so two templates are needed. Medium difficulty: cut each half-circle in one stroke, and turn the paper rather than the scissors.</desc>
