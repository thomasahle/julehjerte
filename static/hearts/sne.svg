<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1" data-overlap-aspect-ratio="1">
  <title>SNE</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Det danske ord SNE med store røde bogstaver tværs over hjertet, flettet helt ind til teksten i lige store tern. Fem striber i hver halvdel. Bogstaverne gør, at de to halvdele klippes forskelligt, så der er to skabeloner, og de runde former gør klipningen svær. Lavet med “Design dit eget hjerte”, hvor du kan skrive dit eget ord.</desc>
  <desc xml:lang="en">The Danish word SNE, meaning snow, in large red letters across the heart, woven right up to the text in checks of one size. Five strips in each half. The letters mean the two halves are cut differently, so there are two templates, and the round shapes make the cutting hard. Made with “Design your own heart”, where you can type a word of your own.</desc>
