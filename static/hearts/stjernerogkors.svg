  <title>Stjerner og kors</title>
  <title xml:lang="en">Stars and crosses</title>
  <desc xml:lang="da">Stjerner og kors: hvide ottetakkede stjerner med spidser på 60 grader og røde kors imellem, som på de persiske fliser fra Kashan, med en hel stjerne midt i hjertet. Fem striber i hver halvdel, alle klip lige, og hvert stykke klip mellem to krydsninger har en tand, en stjernespids, der stikker ind i korset ved siden af. Halvdelene er spejlvendte, og én skabelon dækker begge. Sværhedsgraden er svær; klip hver tand helt ud til spidsen.</desc>
  <desc xml:lang="en">Star and cross: white eight-pointed stars with 60-degree points and red crosses between them, as on the Persian tiles of Kashan, with a whole star in the middle of the heart. Five strips in each half, every cut straight, and every stretch of cut between two crossings carries one tooth, a star's point poking into the cross beside it. The halves mirror each other, and one template covers both. It is rated hard; cut each tooth right out to its point.</desc>
  <desc></desc>
