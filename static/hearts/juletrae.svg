<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="1" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Juletræ</title>
  <desc xml:lang="da">Et rødt grantræ med stamme i et hvidt felt, rammet ind af diagonale bånd og små ruder. Fire striber i hver halvdel, og næsten alle klip er lige; grenspidserne er de eneste steder, hvor saksen skal vende. Halvdelene er spejlvendte, og én skabelon dækker begge. Grenspidserne er de smalleste steder i hjertet, og en saks med skarp spids gør dem lettere at ramme.</desc>
  <desc xml:lang="en">A red fir tree with a trunk in a white field, framed by diagonal bands and small diamonds. Four strips in each half, and nearly every cut is straight; the branch tips are the only places where the scissors have to turn. The halves mirror each other, and one template covers both. Those tips are the narrowest parts of the heart, and sharp-pointed scissors make them much easier to hit.</desc>
