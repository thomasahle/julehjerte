<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1" data-color-left="#ffffff" data-color-right="#b91313">
  <title>Stjernefliser</title>
  <title xml:lang="da">Stjernefliser</title>
  <title xml:lang="en">Star Tiles</title>
  <desc xml:lang="da">Regelmæssige sekskanter og sekstakkede stjerner, som i en islamisk flise, med en stjerne i midten af hjertet; mønsteret er spejlsymmetrisk om hjertets midterlinje. Fem klip i hver halvdel og dermed seks striber, hver klippet som en kantet zigzaglinje. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er ekspert. Brug en skarp kniv og klip hver zigzag i små, bevidste skridt.</desc>
  <desc xml:lang="en">Regular hexagons and six-pointed stars, like an Islamic tile, with a star in the middle of the heart; the pattern is mirror-symmetric about the heart's centre line. Each half has five cuts and so six strips, each cut as an angular zigzag line. The halves mirror each other, so one template covers both, and the difficulty is expert. Use a sharp knife and cut each zigzag in small, deliberate steps.</desc>
