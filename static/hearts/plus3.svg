  <title>Plus 3</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Det samme korsmotiv gentaget over hele fladen, så røde og hvide plusser griber ind i hinanden. Fem striber i hver halvdel og lige klip hele vejen, men knap halvtreds hjørner at følge. Begge halvdele klippes efter samme skabelon. Mønsteret går kun op, hvis over-under-rytmen holder hele vejen, så tæl efter for hver stribe, du fletter.</desc>
  <desc xml:lang="en">The same cross motif repeated across the whole field, so red and white crosses interlock. Five strips in each half and straight cuts throughout, but close to fifty corners to follow. Both halves are cut from the same template. The pattern only comes out right if the over-under rhythm holds all the way, so count again after every strip you weave.</desc>
