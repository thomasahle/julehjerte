<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Kugle</title>
  <desc xml:lang="da">En ternet julekugle midt i et skakbræt. Otte striber i hver halvdel: tre af de syv klip er lige, og de fire andre bøjer ud i buer, så felterne i midten svulmer op til en rund kugle. Halvdelene er spejlvendte, så én skabelon er nok. Sværhedsgraden er mellem; klip hver bue i ét træk, og flet forsigtigt ved kuglens kant, hvor buerne gør striberne smalle.</desc>
  <desc xml:lang="en">A chequered Christmas bauble in the middle of a chequerboard. Eight strips in each half: three of the seven cuts are straight, and the other four bow out in arcs, so the squares in the middle swell into a round ball. The halves mirror each other, so one template is enough. Medium difficulty: cut each arc in a single stroke, and weave gently at the edge of the ball, where the arcs leave the strips narrow.</desc>
