<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Kugle</title>
  <desc xml:lang="da">En stor ternet julekugle, der fylder næsten hele det flettede felt. Seks striber i hver halvdel: det midterste af de fem klip er lige, og de fire andre bøjer ud i buer, så felterne svulmer op til en rund kugle. Halvdelene er spejlvendte, så én skabelon er nok. Sværhedsgraden er mellem; klip hver bue i ét træk, og flet forsigtigt ved kuglens kant, hvor striberne er smalle. Inspireret af en blyantstegning af kunstneren Prince (artistprince.official på Instagram), hvor et skakbræt buler ud til en kugle, og af Johans julekugle på johansjulehjerter.dk.</desc>
  <desc xml:lang="en">A large chequered Christmas bauble that fills almost the whole woven field. Six strips in each half: the middle one of the five cuts is straight, and the other four bow out in arcs, so the squares swell into a round ball. The halves mirror each other, so one template is enough. Medium difficulty: cut each arc in a single stroke, and weave gently at the edge of the ball, where the strips are narrow. Inspired by a pencil drawing by the artist Prince (artistprince.official on Instagram), in which a chequerboard bulges into a sphere, and by Johan's julekugle at johansjulehjerter.dk.</desc>
