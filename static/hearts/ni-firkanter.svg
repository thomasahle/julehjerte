<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Ni firkanter</title>
  <title xml:lang="da">Ni firkanter</title>
  <title xml:lang="en">Nine squares</title>
  <desc xml:lang="da">Ni lige store røde firkanter på en hvid ottekant med røde hjørner: fem står på spidsen som et plus, og fire står lige imellem dem, så de otte yderste mødes hjørne mod hjørne. Fem striber i hver halvdel, og alle klip er lige med knæk. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip hvert knæk helt ud i hjørnet, så firkanterne får skarpe spidser. Fra arkitekt Hans H. Kochs [julehjerter i Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
  <desc xml:lang="en">Nine equal red squares on a white octagon with red corners: five stand on their points in the shape of a plus, and four stand upright between them, so that the outer eight meet corner to corner. Five strips in each half, and every cut is straight with bends. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut each bend right into its corner so that the squares get sharp points. From the architect Hans H. Koch's [Christmas hearts in Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
