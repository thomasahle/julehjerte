<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fisk</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Fish</title>
  <desc xml:lang="da">En fisk, det kristne symbol ΙΧΘΥΣ, svømmer på tværs af hjertet: et bånd med et hvidt øje og to krydsende halefinner. Tre striber i hver halvdel med buede klip, som hver løber en tur rundt i fisken. Halvdelene er forskellige, så der er to skabeloner, og sværhedsgraden er mellem. Klip de korte stykker ved øjets spidser helt præcist, for her ligger de to halvdeles klip oven på hinanden. Tegnet efter [Jan Krümmels skabelon ICTYS](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
  <desc xml:lang="en">A fish, the Christian symbol ΙΧΘΥΣ, swims across the heart: a band with a white eye and two crossing tail fins. Three strips in each half with curved cuts, each of which makes a loop through the fish. The halves differ, so there are two templates, and the difficulty is medium. Cut the short pieces at the tips of the eye precisely, because there the cuts of the two halves lie on top of each other. Drawn after [Jan Krümmel&#39;s ICTYS template](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
