<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fisk</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Fish</title>
  <desc xml:lang="da">Fisken, det kristne symbol ΙΧΘΥΣ, tegnet med streger midt på et kors, hvis fire arme løber ud til hjertets kanter. Tre striber i hver halvdel med buede klip, som hver løber en tur rundt i fisken. Halvdelene er forskellige, så der er to skabeloner, og sværhedsgraden er mellem. Klip korsets smalle arme med en lineal, og klip de korte stykker ved øjets spidser præcist, for her ligger de to halvdeles klip oven på hinanden. Bygger på [Jan Krümmels skabelon ICTYS](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
  <desc xml:lang="en">The fish, the Christian symbol ΙΧΘΥΣ, drawn in lines at the centre of a cross whose four arms run out to the edges of the heart. Three strips in each half with curved cuts, each of which makes a loop through the fish. The halves differ, so there are two templates, and the difficulty is medium. Cut the narrow arms of the cross along a ruler, and cut the short pieces at the tips of the eye precisely, because there the cuts of the two halves lie on top of each other. Builds on [Jan Krümmel&#39;s ICTYS template](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
