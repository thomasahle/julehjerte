<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fisk</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Fish</title>
  <desc xml:lang="da">En fisk, det kristne symbol ΙΧΘΥΣ, svømmer på tværs af hjertet. Tre striber i hver halvdel med buede klip, og fiskens hale er to takker i klippene. Halvdelene er forskellige, så der er to skabeloner, og sværhedsgraden er let. Flet langsomt ved halen, hvor takkerne skal ind under hinanden. Tegnet efter [Jan Krümmels skabelon ICTYS](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
  <desc xml:lang="en">A fish, the Christian symbol ΙΧΘΥΣ, swims across the heart. Three strips in each half with curved cuts, and the tail is two points in the cuts. The halves differ, so there are two templates, and the difficulty is easy. Weave slowly at the tail, where the points have to go under each other. Drawn after [Jan Krümmel&#39;s ICTYS template](https://krymmel.dk/pages/krymmels-jul/flettede-julehjerter.php).</desc>
