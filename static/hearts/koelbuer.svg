  <title>Kølbuer</title>
  <title xml:lang="en">Ogee arches</title>
  <desc xml:lang="da">Kølbuer som i osmanniske silkestoffer og marokkanske lanternefliser: løgformede felter med spids top og bund, skiftevis røde og hvide. Fem striber i hver halvdel, og hvert klip er den samme bølge gentaget fra krydsning til krydsning. Halvdelene er spejlvendte, så én skabelon dækker begge. Det er et let hjerte; klip bølgerne i jævne træk, så spidserne mødes i krydsningerne.</desc>
  <desc xml:lang="en">An ogee lattice, as in Ottoman silks and Moroccan lantern tiles: onion-shaped fields with pointed tops and bottoms, alternately red and white. Five strips in each half, and every cut is the same wave repeated from crossing to crossing. The halves mirror each other, so one template covers both. It is an easy heart; cut the waves in even strokes so the points meet at the crossings.</desc>
  <desc></desc>
