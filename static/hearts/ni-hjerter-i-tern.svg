<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Ni hjerter i tern</title>
  <title xml:lang="en">Nine hearts in checks</title>
  <desc xml:lang="da">Ni små røde hjerter i et skakbræt af røde og hvide tern. Hvert hjerte er et rødt felt med to halvcirkler ind i de hvide naboer; syv striber i hver halvdel, og hvert andet klip har tre runde buer, mens resten er lige. Halvdelene er spejlvendte, så én skabelon dækker begge. Sværhedsgraden er ekspert; klip hver bue helt ind til hjørnet, så hjerternes kløft bliver skarp.</desc>
  <desc xml:lang="en">Nine small red hearts in a chequerboard of red and white squares. Each heart is a red field with two half circles reaching into its white neighbours; seven strips in each half, and every other cut has three round bumps while the rest are straight. The halves mirror each other, so one template covers both. Expert difficulty; cut each bump right into the corner so the hearts' clefts come out sharp.</desc>
