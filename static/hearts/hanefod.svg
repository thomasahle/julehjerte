<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Hanefod</title>
  <desc xml:lang="da">Hanefod (pied-de-poule) i den rene form, hvor to røde og to hvide brikker mødes i hvert hjørne. Fem striber i hver halvdel: den hvide halvdels klip er lige, den rødes er trapper med skarpe tænder. Halvdelene er forskellige, så hjertet har to skabeloner. Sværhedsgraden er svær; klip hver tand helt ud til spidsen, så den bliver skarp som i stoffet.</desc>
  <desc xml:lang="en">Houndstooth (pied-de-poule) in its pure form, where two red and two white pieces meet at every corner. Five strips in each half: the white half's cuts are straight, the red half's are staircases with sharp teeth. The halves differ, so the heart comes with two templates. It is rated hard; cut each tooth right out to its point so it stays sharp, as in the cloth.</desc>
  <desc></desc>
