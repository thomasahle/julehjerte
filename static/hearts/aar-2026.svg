<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0" data-overlap-aspect-ratio="1">
  <title>2026</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Årstallet 2026 med hvide cifre, ét i hvert rødt tern i en række tværs over hjertet. Fire striber i hver halvdel. Cifrene gør, at de to halvdele klippes forskelligt, så der er to skabeloner, og deres buer og knopper gør hjertet svært. Lavet med “Design dit eget hjerte”, hvor du kan skrive dit eget årstal eller ord.</desc>
  <desc xml:lang="en">The year 2026 in white figures, one in each red check along a row across the heart. Four strips in each half. The figures mean the two halves are cut differently, so there are two templates, and their curves and ball ends make the heart hard. Made with “Design your own heart”, where you can type a year or a word of your own.</desc>
