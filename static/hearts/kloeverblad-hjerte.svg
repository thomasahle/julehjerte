<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Kløverblads-hjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Clover leaf heart</title>
  <desc xml:lang="da">Fire runde kløverblade om midten og en kvartcirkel i hvert hjørne. Fire striber i hver halvdel; de midterste klip er lige, og de yderste bugter sig om bladene. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip buerne i ét træk, så bladene bliver runde.</desc>
  <desc xml:lang="en">Four round clover leaves around the centre and a quarter circle in each corner. Four strips in each half; the middle cuts are straight and the outer ones curve around the leaves. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut each curve in a single stroke so the leaves stay round.</desc>
