<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Potteplante</title>
  <title xml:lang="da">Potteplante</title>
  <title xml:lang="en">Potted plant</title>
  <desc xml:lang="da">En rød potteplante med et spidst ovalt midterblad og to buede blade til hver side, der svinger op og ud fra en stilk, som står i en pokalformet urtepotte med bred kant, under en rød bue. Fire striber i hver halvdel med buede klip. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip bladenes buer i lange, rolige træk og potten langsomt, for dens kant og fod er de mindste buer i skabelonen. Fra arkitekt Hans H. Kochs [julehjerter i Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
  <desc xml:lang="en">A red potted plant with a pointed oval middle leaf and two curved leaves to each side that sweep up and out from a stem standing in a goblet-shaped pot with a wide rim, under a red arch. Four strips in each half with curved cuts. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut the leaves in long, steady strokes and the pot slowly, as its rim and foot are the smallest curves in the template. From the architect Hans H. Koch's [Christmas hearts in Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
