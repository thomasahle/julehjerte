<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fejlternet hjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Bias-check heart</title>
  <desc xml:lang="da">Et ternet hjerte, hvor ternene er drejet en ottendedel omgang og står på spidsen, med et helt tern midt i hjertet. Fem striber i hver halvdel, alle klip lige, men med mange knæk; flere steder ligger de to halvdeles klip oven på hinanden, så de ikke ses. Begge halvdele klippes efter samme skabelon, men mønsteret drejer i stedet for at være spejlvendt, så læg de to halvdele som på billedet, før du fletter. Sværhedsgraden er svær; klip langs en lineal, og flet langsomt ved kanterne, hvor de små halve tern sidder.</desc>
  <desc xml:lang="en">A checked heart whose checks are turned an eighth of a turn and stand on their points, with a whole check at the centre. Five strips in each half, all cuts straight but with many corners; in several places the two halves' cuts lie on top of each other, so they don't show. Both halves are cut from the same template, but the pattern turns rather than mirrors, so lay the two halves as in the picture before weaving. The difficulty is hard; cut along a ruler and weave slowly at the edges, where the small half checks sit.</desc>
