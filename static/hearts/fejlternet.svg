<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Fejlternet hjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Bias-check heart</title>
  <desc xml:lang="da">Et ternet hjerte, hvor ternene er drejet en ottendedel omgang og står på spidsen. Fire striber i hver halvdel med lige klip i zigzag. Én skabelon dækker begge halvdele, og sværhedsgraden er mellem. Klip zigzaggen med en lineal og flet langsomt ved kanterne, hvor de halve tern sidder.</desc>
  <desc xml:lang="en">A checked heart whose checks are turned an eighth of a turn and stand on their points. Four strips in each half with straight zigzag cuts. One template covers both halves, and the difficulty is medium. Cut the zigzags along a ruler and weave slowly at the edges, where the half checks sit.</desc>
