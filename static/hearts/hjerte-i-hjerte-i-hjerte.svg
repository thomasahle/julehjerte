<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Hjerte i hjerte i hjerte</title>
  <title xml:lang="en">Heart in heart in heart</title>
  <desc xml:lang="da">Tre hjerter inde i hinanden: et lille 3 × 3-hjerte i et 5 × 5-hjerte, der ligger på et klassisk 7 × 7-hjerte. Farverne skifter for hvert hjerte, så det mellemste har rød venstre runding og hvid højre, og det inderste har dem som det store. Syv striber i hver halvdel med lige klip og buer langs hjerternes rundinger; mange steder ligger de to halvdeles klip oven på hinanden, så de ikke ses. Halvdelene er forskellige, så der er to skabeloner. Sværhedsgraden er ekspert; papiret bliver smalt flere steder, så klip langsomt og brug stærkt papir.</desc>
  <desc xml:lang="en">Three hearts inside one another: a small 3 × 3 heart in a 5 × 5 heart, which lies on a classic 7 × 7 heart. The colours swap with each heart, so the middle one has a red left lobe and a white right one, and the innermost has them like the big heart. Seven strips in each half, with straight cuts and arcs along the hearts' lobes; in many places the cuts of the two halves lie on top of each other, so they do not show. The halves differ, so there are two templates. The difficulty is expert; the paper gets narrow in several places, so cut slowly and use strong paper.</desc>
