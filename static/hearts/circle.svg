  <title
     id="title1">Uret v2</title>
  <title xml:lang="da">Uret</title>
  <title xml:lang="en">The clock</title>
  <desc xml:lang="da">En bred rød ring om et tomt midterfelt, brudt af fire åbninger, med buer der løber videre ud mod kanten. Fem striber i hver halvdel, og godt halvdelen af klippene er buer, som tilsammen former ringen. Halvdelene er spejlvendte, og én skabelon dækker begge. En ring afslører enhver skæv bue, så klip langsomt og drej papiret i stedet for saksen. Uret er en variant af nr. 366b i [Hjerter til Juletræet](https://papermatrix.wordpress.com/wp-content/uploads/2010/04/ajacobsen.jpg), som Alfred Jacobsens Kunstforlag udgav i 1924, hvor ringen omslutter en fyldt skive.</desc>
  <desc xml:lang="en">A wide red ring around an empty middle, broken by four openings, with arcs running on towards the edge. Five strips in each half, and a good half of the cuts are curves that together form the ring. The halves mirror each other, and one template covers both. A ring shows up every uneven curve, so cut slowly and turn the paper rather than the scissors. The clock is a variant of no. 366b in [Hjerter til Juletræet](https://papermatrix.wordpress.com/wp-content/uploads/2010/04/ajacobsen.jpg), published by Alfred Jacobsens Kunstforlag in 1924, where the ring encloses a solid disc.</desc>
  <desc
     id="desc1">A simple clock</desc>
