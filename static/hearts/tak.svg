<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1" data-overlap-aspect-ratio="1">
  <title>TAK</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Ordet TAK med store røde bogstaver med kraftige seriffer tværs over hjertet, flettet ind i tern på bogstavernes egen størrelse. Fem striber i hver halvdel og to skabeloner. Bogstaverne er brede, så papiret mellem klippene er solidt, men de mange hjørner gør klipningen svær. Et hjerte at sige tak med. Lavet med “Design dit eget hjerte”, hvor du kan skrive dit eget ord.</desc>
  <desc xml:lang="en">The word TAK, Danish for thank you, in large red slab-serif letters across the heart, woven into checks the size of the letters. Five strips in each half and two templates. The letters are broad, so the paper between the cuts is sturdy, but the many corners make the cutting hard. A heart to say thank you with. Made with “Design your own heart”, where you can type a word of your own.</desc>
