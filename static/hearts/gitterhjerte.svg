<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Gitterhjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Lattice heart</title>
  <desc xml:lang="da">Et gitter af bånd med firkantede ruder, der står lige op i det hængende hjerte. Fem striber i hver halvdel med lige klip i trapper. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er svær. Klip med en lineal, så ruderne bliver lige store.</desc>
  <desc xml:lang="en">A lattice of bands with square panes that stand upright in the hanging heart. Five strips in each half with straight stepped cuts. The halves mirror each other, so one template covers both, and the difficulty is hard. Cut along a ruler so all the panes come out the same size.</desc>
