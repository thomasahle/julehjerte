<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0" data-pattern="{&quot;rule&quot;:&quot;two18&quot;,&quot;cuts&quot;:3,&quot;curves&quot;:{&quot;side&quot;:[[0,0,0.132608244919772,-0.132608244919772,0.3124636215519654,-0.20710678118654752,0.5,-0.20710678118654752]]},&quot;inverted&quot;:true,&quot;shape&quot;:[0.988572,0,0,0.988572],&quot;pan&quot;:[1,1]}">
  <title>Cirkler</title>
  <title xml:lang="en">Circles</title>
  <desc xml:lang="da">Et gitter af runde cirkler i hjertets midte. Fire striber i hver halvdel, og alle tre klip er bølger af cirkelbuer, så hver stribe skiftevis svulmer og snævres ind. Begge halvdele klippes efter samme skabelon, og sværhedsgraden er mellem. Nabocirklerne rører lige hinanden, så buerne glider over i hinanden; klip hver bølge i ét roligt træk, så cirklerne bliver runde. Mønsteret er arkitekt Hans H. Kochs fra [Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php); skabelonen følger Per V. Mortensens [tegning](https://web.archive.org/web/20070821003348/http://permo.homepage.dk/hjcir-01.htm). Fotoet af det flettede hjerte er hans.</desc>
  <desc xml:lang="en">A grid of round circles in the middle of the heart. Four strips in each half, and all three cuts are waves of circular arcs, so each strip swells and narrows in turn. Both halves are cut from the same template, and the difficulty is medium. Neighbouring circles just touch, so the arcs flow into one another; cut each wave in one steady stroke so the circles stay round. The pattern is the architect Hans H. Koch's, from [Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php); the template follows Per V. Mortensen's [drawing](https://web.archive.org/web/20070821003348/http://permo.homepage.dk/hjcir-01.htm). The photo of the woven heart is his.</desc>
