<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Cirkler</title>
  <title xml:lang="en">Circles</title>
  <desc xml:lang="da">Et gitter af runde cirkler i hjertets midte. Fire striber i hver halvdel, og alle tre klip er bølger af cirkelbuer, så hver stribe skiftevis svulmer og snævres ind. Begge halvdele klippes efter samme skabelon, og sværhedsgraden er mellem. Nabocirklerne rører lige hinanden, så buerne glider over i hinanden; klip hver bølge i ét roligt træk, så cirklerne bliver runde. Fra Per V. Mortensens [Circles in Hearts](https://web.archive.org/web/20070821003348/http://permo.homepage.dk/hjcir-01.htm).</desc>
  <desc xml:lang="en">A grid of round circles in the middle of the heart. Four strips in each half, and all three cuts are waves of circular arcs, so each strip swells and narrows in turn. Both halves are cut from the same template, and the difficulty is medium. Neighbouring circles just touch, so the arcs flow into one another; cut each wave in one steady stroke so the circles stay round. From Per V. Mortensen's [Circles in Hearts](https://web.archive.org/web/20070821003348/http://permo.homepage.dk/hjcir-01.htm).</desc>
