  <title>Drageskæl</title>
  <title xml:lang="en">Dragon scales</title>
  <desc xml:lang="da">Drageskæl: hvert felt har to svulmende og to hule sider, alle drejet samme vej, så røde og hvide skæl griber ind i hinanden. Fem striber i hver halvdel, og hvert klip er en række halve bølger. Halvdelene bøjer modsat, så hjertet har to skabeloner. Sværhedsgraden er mellem; følg buerne i jævne træk, så alle skæl får samme form.</desc>
  <desc xml:lang="en">Dragon scales: every field has two swelling sides and two hollow ones, all turned the same way, so red and white scales interlock. Five strips in each half, and every cut is a row of half waves. The halves bend opposite ways, so the heart comes with two templates. Medium difficulty; follow the curves in even strokes so all the scales get the same shape.</desc>
  <desc></desc>
