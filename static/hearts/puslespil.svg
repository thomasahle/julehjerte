<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="1" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Puslespil</title>
  <title xml:lang="en">Jigsaw</title>
  <desc xml:lang="da">Et puslespil med fire gange fire brikker: hvert stykke klip mellem to krydsninger har en knop med smal hals og rundt hoved, skubbet ind i brikken på den ene eller den anden side, og brikkerne langs kanten har den lige kant fra et rigtigt puslespil. Fire striber i hver halvdel. Knopperne sidder forskelligt i de to halvdele, så hjertet har to skabeloner. Det er et let hjerte; klip langsomt rundt om hver knop.</desc>
  <desc xml:lang="en">A jigsaw puzzle of four by four pieces: every stretch of cut between two crossings has a knob with a narrow neck and a round head, pushed into the piece on one side or the other, and the pieces along the edge keep the straight side of a real puzzle. Four strips in each half. The knobs sit differently in the two halves, so the heart comes with two templates. It is an easy heart; cut slowly round each knob.</desc>
  <desc></desc>
