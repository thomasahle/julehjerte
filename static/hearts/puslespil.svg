  <title>Puslespil</title>
  <title xml:lang="en">Jigsaw</title>
  <desc xml:lang="da">Et puslespil med fire gange fire brikker, skåret som et rigtigt puslespil: hver brik har to knopper ud til modsatte sider og to huller, og hver anden brik er drejet en kvart omgang. Hvert stykke klip mellem to krydsninger har én knop med smal hals og rundt hoved, og brikkerne langs kanten har den lige kant fra et rigtigt puslespil. Fire striber i hver halvdel. Knopperne sidder forskelligt i de to halvdele, så hjertet har to skabeloner. Sværhedsgraden er svær; klip langsomt rundt om hver knop.</desc>
  <desc xml:lang="en">A jigsaw puzzle of four by four pieces, cut like a real one: every piece has two knobs on opposite sides and two holes, and every other piece is turned a quarter. Every stretch of cut between two crossings has one knob with a narrow neck and a round head, and the pieces along the edge keep the straight side of a real puzzle. Four strips in each half. The knobs sit differently in the two halves, so the heart comes with two templates. It is rated hard; cut slowly round each knob.</desc>
  <desc></desc>
