<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fiskeskæl</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Fish scales</title>
  <desc xml:lang="da">Rækker af fiskeskæl, der ligger som tagsten: hver skæl er rund foroven, og skællet nedenfor skærer ind i den. Fem striber i hver halvdel med buede klip af kvartcirkler. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip hver bue i ét træk, så spidserne mellem skællene bliver skarpe.</desc>
  <desc xml:lang="en">Rows of fish scales laid like roof tiles: each scale is round at the top, and the scale below cuts into it. Five strips in each half with curved cuts made of quarter circles. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut each arc in a single stroke so the points between the scales stay sharp.</desc>
