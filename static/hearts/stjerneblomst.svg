<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Stjerneblomst</title>
  <title xml:lang="da">Stjerneblomst</title>
  <title xml:lang="en">Star flower</title>
  <desc xml:lang="da">En blomst af otte ens røde kronblade jævnt fordelt om en rund midte, med en ring af hvid bund om midten og det hele i en hvid ottekant. Fem striber i hver halvdel med buede klip. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip de korte lige stykker hen over ringen skarpt; de ligger oven i hinanden i de to halvdele. Fra arkitekt Hans H. Kochs [julehjerter i Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
  <desc xml:lang="en">A flower of eight identical red petals spaced evenly round a round centre, with a ring of white ground round the centre and the whole in a white octagon. Five strips in each half with curved cuts. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut the short straight pieces across the ring sharply; they lie on top of each other in the two halves. From the architect Hans H. Koch's [Christmas hearts in Børnenes Magasin 1916](https://aldus.dk/hanskoch/julehjerter.php).</desc>
