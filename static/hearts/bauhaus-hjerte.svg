<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Bauhaushjerte</title>
  <title xml:lang="en">Bauhaus heart</title>
  <desc xml:lang="da">Et lille hjerte midt i et mønster af halvcirkler i Bauhaus-stil. Halvcirklerne er præcis lige så brede som ternene, og hvor to af dem mødes i samme tern, står der en smal linse tilbage. Fire striber i hver halvdel, klippet med halvcirkler. Halvdelene er spejlvendte, så én skabelon er nok. Sværhedsgraden er mellem; klip hver halvcirkel i ét træk, og vær forsigtig med de små spidser, hvor to halvcirkler mødes.</desc>
  <desc xml:lang="en">A small heart in the middle of a pattern of half-circles in the Bauhaus style. The half-circles are exactly as wide as the squares, and where two of them meet in the same square a narrow lens is left. Four strips in each half, cut with half-circles. The halves mirror each other, so one template is enough. Medium difficulty: cut each half-circle in one stroke, and take care with the small points where two half-circles meet.</desc>
