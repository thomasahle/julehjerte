  <title>Sildeben</title>
  <title xml:lang="en">Herringbone</title>
  <desc xml:lang="da">Sildeben: skrå felter, der skifter retning fra række til række som i et parketgulv. Seks striber i hver halvdel; den hvide halvdels klip går i zigzag, den rødes er lige, og zigzaggen knækker netop dér, hvor de lige klip krydser. Halvdelene er forskellige, så hjertet har to skabeloner. Sværhedsgraden er mellem; klip zigzaggen med lineal, ét knæk ad gangen.</desc>
  <desc xml:lang="en">Herringbone: slanted fields that change direction from row to row, as in a parquet floor. Six strips in each half; the white half's cuts zigzag and the red half's are straight, and the zigzag turns exactly where the straight cuts cross it. The halves differ, so the heart comes with two templates. Medium difficulty; cut the zigzag with a ruler, one turn at a time.</desc>
