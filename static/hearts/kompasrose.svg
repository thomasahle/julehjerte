<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Kompasrose</title>
  <title xml:lang="da">Kompasrose</title>
  <title xml:lang="en">Compass rose</title>
  <desc xml:lang="da">En ottetakket stjerne af kantede blade, parvis omkring et lille ternet midterfelt. Hver halvdel har fem striber: to klip er zigzag med to tænder hver, og to er svage buer. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip zigzaggen langs en lineal, ét knæk ad gangen. Mønsteret er fra [Illustreret Familie-Journal 1922](https://papermatrix.wordpress.com/wp-content/uploads/2010/04/koch-1.jpg), der ikke nævner tegneren.</desc>
  <desc xml:lang="en">An eight-pointed star of angular petals, set in pairs around a small checked centre. Each half has five strips: two cuts zigzag with two teeth each, and two are gentle curves. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut the zigzags along a ruler, one bend at a time. The pattern is from [Illustreret Familie-Journal 1922](https://papermatrix.wordpress.com/wp-content/uploads/2010/04/koch-1.jpg), which does not name its designer.</desc>
  <!-- Attribution: the 1922 page carries no byline in its heading, opening paragraph or captions. The scan comes from the papermatrix.wordpress.com Links page, whose author writes: "In 1922 patterns for an additional four baskets were published in Illustreret Familie Journal. Although not indicated it is most likely that Hans H. Koch also designed these." Koch (1873-1922, d. 5 Sept 1922) signed his 1916 Boernenes Magasin hearts; aldus.dk, the main source on Koch, does not mention the 1922 page. Designer therefore unknown. -->
