<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" data-color-left="#ffffff" data-color-right="#b91313" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Penrose-stjerner</title>
  <title xml:lang="da">Penrose-stjerner</title>
  <title xml:lang="en">Penrose Stars</title>
  <desc xml:lang="da">Et større udsnit af Penrose-fliserne, med både en ring og flere femtakkede stjerner af smalle røde ruder. Seks klip i hver halvdel og dermed syv striber, klippet i mange skarpe knæk. Halvdelene er forskellige, så der skal to skabeloner til, og sværhedsgraden er ekspert. Striberne er smalle, så brug en skarp kniv og tag god tid, især nær kanten.</desc>
  <desc xml:lang="en">A larger crop of the Penrose tiling, with a ring and several five-pointed stars made of narrow red rhombi. Each half has six cuts and so seven strips, cut in many sharp bends. The halves differ, so it takes two templates, and the difficulty is expert. The strips are narrow, so use a sharp knife and take your time, especially near the edge.</desc>
