<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Tulipan</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Tulip</title>
  <desc xml:lang="da">En opretstående tulipan med to blade i en oval medaljon. Fire striber i hver halvdel med buede klip: de yderste klip tegner ovalen, og det midterste tegner blomsten. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip spidserne på blade og kronblade forsigtigt, så de ikke knækker under fletningen.</desc>
  <desc xml:lang="en">An upright tulip with two leaves in an oval medallion. Four strips in each half with curved cuts: the outer cuts draw the oval and the middle one draws the flower. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut the tips of the leaves and petals carefully so they do not snap while you weave.</desc>
