  <title
     id="title1">Nihon</title>
  <desc xml:lang="da">En stor rød skive midt i det hvide felt, med tre kiler ud mod kanten; navnet er det japanske ord for Japan. Kun tre striber i hver halvdel, og skiven kommer af en enkelt bue på hver af de midterste striber. Halvdelene er spejlvendte, og én skabelon dækker begge. Hjertet er let, men buen skal klippes i ét træk, hvis cirklen skal blive rund.</desc>
  <desc xml:lang="en">A large red disc in the middle of the white field, with three wedges reaching towards the edge; the name is the Japanese word for Japan. Only three strips in each half, and the disc comes from a single curve on each of the middle strips. The halves mirror each other, and one template covers both. The heart is easy, but cut the curve in one stroke if the circle is to stay round.</desc>
