<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="1" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Hvirvel</title>
  <title xml:lang="en">Whirl</title>
  <desc xml:lang="da">En hvirvel: skakbrættet er drejet næsten en halv omgang i midten og mindre og mindre ud mod kanten, så felterne fejer rundt om midten i buede arme. Fem striber i hver halvdel, og hvert klip er en blød S-bue. Den ene halvdel er den anden drejet en kvart omgang, så én skabelon dækker begge. Det er et let hjerte; klip buerne i lange, jævne træk.</desc>
  <desc xml:lang="en">A whirlpool: the chequerboard is turned almost half a turn at the centre and less and less towards the edge, so the fields sweep round the middle in curved arms. Five strips in each half, and every cut is a gentle S-curve. One half is the other turned a quarter, so one template covers both. It is an easy heart; cut the curves in long, even strokes.</desc>
  <desc></desc>
