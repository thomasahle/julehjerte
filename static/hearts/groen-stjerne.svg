<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Grøn stjerne</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Green star</title>
  <desc xml:lang="da">En ottetakket stjerne med stråler ud mod kanterne. Fem striber i hver halvdel med lige klip i zigzag. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip spidserne med en lineal, så stjernens takker bliver skarpe.</desc>
  <desc xml:lang="en">An eight-pointed star with rays out towards the edges. Five strips in each half with straight zigzag cuts. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut the points along a ruler so the star's tips stay sharp.</desc>
