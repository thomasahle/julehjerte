<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Gaver</title>
  <desc xml:lang="da">Fire større røde felter mellem smalle bånd, så mønsteret læses som fire små gaver med snor omkring. Alle seks striber i hver halvdel er lige, så klipningen er enkel, men antallet af striber gør flettingen langsommere. Halvdelene er spejlvendte, og én skabelon dækker begge. Hold øje med over-under-rytmen stribe for stribe; en enkelt fejl forskyder hele mønsteret.</desc>
  <desc xml:lang="en">Four larger red fields between narrow bands, so the pattern reads as four small parcels tied with string. All six strips in each half are straight, which keeps the cutting simple, but the number of strips makes the weaving slower. The halves mirror each other, and one template covers both. Watch the over-under rhythm strip by strip; a single mistake shifts the whole pattern.</desc>
  <desc>4 små julegaver</desc>
