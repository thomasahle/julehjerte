  <title>Khatam</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Et khatam-motiv gentaget som små møller ud over hele fladen; khatam er den ottetakkede stjerne, der er udbredt i islamisk kunst og arkitektur. Seks striber i hver halvdel, alle klip lige, men med næsten to hundrede knæk fordelt på striberne. Halvdelene er ikke ens, så hjertet har to skabeloner. Det er en ekspertopgave; hold skabelonen fast, og klip de mange små hjørner ét ad gangen.</desc>
  <desc xml:lang="en">A khatam motif repeated as small pinwheels across the whole field; khatam is the eight-pointed star prominent in Islamic art and architecture. Six strips in each half, every cut straight, but with close to two hundred turns spread over the strips. The halves are not alike, so the heart comes with two templates. This is an expert job; hold the template down firmly and cut the many small corners one at a time.</desc>
  <desc>A Khatam star is an eight-pointed star prominent in Islamic art and architecture</desc>
