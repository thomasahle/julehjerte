<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" data-color-left="#ffffff" data-color-right="#b91313" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Penrose-ring</title>
  <title xml:lang="da">Penrose-ring</title>
  <title xml:lang="en">Penrose Ring</title>
  <desc xml:lang="da">Penrose-fliser, et mønster af to slags rudere der aldrig gentager sig: en ring af smalle røde ruder om en femtakket stjerne i midten, set som et udsnit af fliserne. Fire klip i hver halvdel, klippet i skarpe knæk langs rudernes kanter. Halvdelene er forskellige, så der skal to skabeloner til, og sværhedsgraden er svær. Klip langsomt og vend papiret ved hvert knæk, så de smalle striber ikke rives.</desc>
  <desc xml:lang="en">Penrose tiling, a pattern of two kinds of rhombus that never repeats: a ring of narrow red rhombi around a five-pointed star in the middle, seen as a crop of the tiling. Each half has four cuts, made as sharp bends along the edges of the rhombi. The halves differ, so it takes two templates, and the difficulty is hard. Cut slowly and turn the paper at each bend so the narrow strips do not tear.</desc>
