  <title
     id="title1">Weave 1</title>
  <title xml:lang="da">Flet 1</title>
  <desc xml:lang="da">Et åbent felt i midten, rammet ind af brede bånd og rækker af små tern. Halvdelene har hvert sit antal striber, otte og syv, og bredden veksler fra stribe til stribe; klippene er lige på nær et par bløde buer. Fordi de to sider ikke er ens, hører der en skabelon til hver. Der er ingen knæk at ramme, så klipningen er ligetil, og det er flettingen, der tager tid.</desc>
  <desc xml:lang="en">An open field in the middle, framed by wide bands and rows of small checks. The two halves carry different strip counts, eight and seven, and the widths change from strip to strip; the cuts are straight apart from a couple of soft curves. Because the sides are not alike, each gets its own template. There are no corners to hit, so the cutting is straightforward and it is the weaving that takes the time.</desc>
