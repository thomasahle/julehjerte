  <title>Alhambra</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Et mønster inspireret af flisemønstrene i Alhambra: røde og hvide møllefigurer, der griber ind i hinanden over hele fladen. Seks striber i hver halvdel, alle klip lige, men med mange skarpe hjørner. Halvdelene er spejlvendte, og én skabelon dækker begge. Hjørnerne har det med at hænge fast under flettingen, så hjertet er ikke det første, man skal give sig i kast med.</desc>
  <desc xml:lang="en">A pattern inspired by the tilings of the Alhambra: red and white pinwheel figures interlocking across the whole field. Six strips in each half, every cut straight, but with a lot of sharp corners. The halves mirror each other, and one template covers both. The corners tend to snag while weaving, so this should not be your first braiding project.</desc>
  <desc>A pattern inspired by the Alhambra tiling. Note that it is somewhat tricky to braid, as the corners tend to snag, so it should not be your first braiding project.</desc>
