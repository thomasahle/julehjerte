<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0" data-overlap-aspect-ratio="1">
  <title>NOEL</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Ordet NOEL, fransk for jul, med hvide bogstaver i en række tern tværs over hjertets midte, ét bogstav i hvert tern. Fire striber i hver halvdel. Bogstaverne gør, at de to halvdele klippes forskelligt, så hjertet har to skabeloner, og de mange små knæk gør det svært. Lavet med “Design dit eget hjerte”, hvor du kan skrive dit eget ord.</desc>
  <desc xml:lang="en">The word NOEL, French for Christmas, in white letters along a row of checks across the middle of the heart, one letter to a check. Four strips in each half. The letters mean the two halves are cut differently, so the heart comes with two templates, and the many short turns make it hard. Made with “Design your own heart”, where you can type a word of your own.</desc>
