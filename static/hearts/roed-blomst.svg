<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Rød blomst</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Red flower</title>
  <desc xml:lang="da">En blomst med otte runde kronblade og en hvid midte, og en kvartcirkel i hvert hjørne. Tre striber i hver halvdel med buede klip. Halvdelene er forskellige, så der er to skabeloner, og sværhedsgraden er mellem. Midten holdes af korte stykker, hvor de to halvdeles klip ligger oven på hinanden, så klip dem præcist.</desc>
  <desc xml:lang="en">A flower with eight round petals and a white centre, and a quarter circle in each corner. Three strips in each half with curved cuts. The halves differ, so there are two templates, and the difficulty is medium. The centre is held by short pieces where the cuts of the two halves lie on top of each other, so cut those precisely.</desc>
