<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1" data-overlap-aspect-ratio="1">
  <title>FRED</title>
  <title xml:lang="da"></title>
  <title xml:lang="en"></title>
  <desc xml:lang="da">Ordet FRED med hvide bogstaver på en rød medaljon, omkranset af en dobbelt bort af røde og hvide bånd som på et julekort. Syv striber i hver halvdel og to skabeloner. Borten klippes lige, men bogstaverne og cirklen giver mange buer og knæk, så hjertet er for øvede. Lavet med “Design dit eget hjerte”, hvor du kan skrive dit eget ord.</desc>
  <desc xml:lang="en">The word FRED, Danish for peace, in white letters on a red medallion inside a double border of red and white bands, as on a Christmas card. Seven strips in each half and two templates. The border is cut straight, but the letters and the circle add many curves and turns, so this heart is for experienced hands. Made with “Design your own heart”, where you can type a word of your own.</desc>
