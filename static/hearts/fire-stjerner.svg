<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Fire stjerner</title>
  <title xml:lang="en">Four stars</title>
  <desc xml:lang="da">Fire stjerner i et skakbræt, der trækkes sammen om fire punkter og svulmer op imellem dem. Ved hver stjerne knækker de to nærmeste klip på hver side ind mod stjernens linje, så felterne omkring den bliver til spidser, og mellem stjernerne vokser den midterste stribe til over dobbelt bredde; elleve striber i hver halvdel, og alle klip er lige stykker. Halvdelene er spejlvendte, så én skabelon dækker begge. Sværhedsgraden er mellem; klip knækkene skarpt, hvor klippene krydser en stjernes linje.</desc>
  <desc xml:lang="en">Four stars in a chequerboard that is drawn together at four points and swells out between them. At each star the two nearest cuts on either side bend in towards the star's line, so the fields around it become points, and between the stars the middle strip grows to more than twice its width; eleven strips in each half, and every cut is made of straight pieces. The halves mirror each other, so one template covers both. Medium difficulty; make the bends sharp where the cuts cross a star's line.</desc>
