<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-weave-parity="0" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
  <title>Stjerne</title>
  <title xml:lang="en">Star</title>
  <desc xml:lang="da">En ottetakket hvid stjerne midt i et rødt felt. Der er kun tre striber i hver halvdel, men hver stribe knækker frem og tilbage for at danne takkerne, så klippene er lige og alligevel spidse. Halvdelene er spejlvendte, og én skabelon dækker begge. Klip de spidse hjørner med en lille saks, så takkerne ikke bliver runde.</desc>
  <desc xml:lang="en">An eight-pointed white star in the middle of a red field. There are only three strips in each half, but every strip zigzags to form the points, so the cuts stay straight and still come out sharp. The halves mirror each other, and one template covers both. Cut the sharp corners with small scissors so the points do not end up rounded.</desc>
  <desc>Klassisk design</desc>
