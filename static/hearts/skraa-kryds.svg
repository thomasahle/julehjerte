  <title>Skrå kryds</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Slanted crosses</title>
  <desc xml:lang="da">Kors i to farver, der griber ind i hinanden og står skråt i hjertet. Fire striber i hver halvdel med lige klip, der går i trapper med rette vinkler. Én skabelon dækker begge halvdele, og sværhedsgraden er mellem. Klip trapperne med en lineal, så korsenes hjørner bliver skarpe.</desc>
  <desc xml:lang="en">Crosses in two colours that interlock and stand at a slant in the heart. Four strips in each half with straight cuts that step at right angles. One template covers both halves, and the difficulty is medium. Cut the steps along a ruler so the corners of the crosses stay sharp.</desc>
