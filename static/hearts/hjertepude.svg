<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="0">
  <title>Hjertepude</title>
  <title xml:lang="en">Heart cushion</title>
  <desc xml:lang="da">Et ternet hjerte, der buler op af det flettede felt som en pude. Rundt om hjertet er ternene hele og lige store, og hjertet ligger oven på dem: det dækker hjørnerne af ternene langs siderne og tager et lille hak af det nederste tern. Seks striber i hver halvdel, lige uden for hjertet og buede hen over det. Halvdelene er spejlvendte, så én skabelon er nok. Sværhedsgraden er mellem; klip hver bue i ét træk, og flet forsigtigt ved hjertets top, hvor den yderste stribe er smal. I familie med Kugle og inspireret af en tegning, hvor et skakbræt buler op til et hjerte.</desc>
  <desc xml:lang="en">A chequered heart that swells out of the woven field like a cushion. Around it the squares are whole and the same size, and the heart lies on top of them: it covers the corners of the squares along its sides and takes a small bite of the bottom one. Six strips in each half, straight outside the heart and curved across it. The halves mirror each other, so one template is enough. Medium difficulty: cut each curve in one stroke, and weave gently at the top of the heart, where the outer strip is narrow. A relative of the Bauble, inspired by a drawing in which a chequerboard swells into a heart.</desc>
