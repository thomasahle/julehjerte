<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Firkanthjerte</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Squircle heart</title>
  <desc xml:lang="da">Som Cirkelhjerte, men ringene er runde firkanter, der ligger midt imellem en cirkel og et kvadrat. Ti striber i hver halvdel; hvert klip er lige med en bue på midten. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Brug tyndt papir, for de mange smalle striber fylder meget i fletningen.</desc>
  <desc xml:lang="en">Like the Circle heart, but the rings are rounded squares, halfway between a circle and a square. Ten strips in each half; each cut is straight with a curve in the middle. The halves mirror each other, so one template covers both, and the difficulty is medium. Use thin paper, because the many narrow strips take up a lot of room in the weave.</desc>
