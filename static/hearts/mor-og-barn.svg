<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Mor og barn</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Mother and child</title>
  <desc xml:lang="da">Det klassiske mor-og-barn-hjerte: et lille hjerte flettet ind i det store. Fire striber i hver halvdel; de lige klip danner skakbrættet, og buerne i klippene tegner det lille hjertes to lapper. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Klip buerne i ét træk og flet langsomt omkring det lille hjertes kløft, hvor striberne skifter retning.</desc>
  <desc xml:lang="en">The classic mother-and-child heart: a small heart woven into the large one. Four strips in each half; the straight cuts make the chequerboard, and the arcs in the cuts draw the small heart&#39;s two lobes. The halves mirror each other, so one template covers both, and the difficulty is medium. Cut each arc in a single stroke and weave slowly around the small heart&#39;s cleft, where the strips change direction.</desc>
