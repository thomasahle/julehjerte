<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" data-weave-parity="1">
  <title>Bølger</title>
  <title xml:lang="da"></title>
  <title xml:lang="en">Waves</title>
  <desc xml:lang="da">Dråber, der hænger i snore ned gennem hjertet, så mønstret bølger fra side til side. Fem striber i hver halvdel med buede klip af kvartcirkler. Halvdelene er spejlvendte, så én skabelon dækker begge, og sværhedsgraden er mellem. Flet roligt, så buerne ikke knækker, hvor de mødes i en spids.</desc>
  <desc xml:lang="en">Drops hanging in strings down through the heart, so the pattern waves from side to side. Five strips in each half with curved cuts made of quarter circles. The halves mirror each other, so one template covers both, and the difficulty is medium. Weave gently so the arcs do not crease where they meet in a point.</desc>
