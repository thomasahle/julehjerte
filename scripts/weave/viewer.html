<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Julehjerte Weave Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column. A green cutting-mat stage holds the 3D playback; the caption and transport sit under it, facts about the run last. */
:root{
  --bg:#F1F3EE; --surface:#FBFCFA; --ink:#16231C; --muted:#56655C; --rule:#D3DAD2;
  --accent:#C8102E; --on-accent:#FFFFFF; --soft:#E6EBE4;
  --mat:#1C4636; --on-mat:#EAF2EC; --mat-glass:rgba(12,32,24,.62);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151E19; --ink:#E8EDE7; --muted:#98A69D; --rule:#27332C;
  --accent:#F2536A; --on-accent:#1B0509; --soft:#1C2721;
  --mat:#173B2E; --on-mat:#EAF2EC; --mat-glass:rgba(8,22,17,.66); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151E19; --ink:#E8EDE7; --muted:#98A69D; --rule:#27332C;
  --accent:#F2536A; --on-accent:#1B0509; --soft:#1C2721;
  --mat:#173B2E; --on-mat:#EAF2EC; --mat-glass:rgba(8,22,17,.66); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}
.head > div{min-width:0}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font:700 clamp(26px,4.2vw,38px)/1.08 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}

.picker{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px;flex-wrap:wrap}
.picker button{font:600 14px/1 var(--body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.picker button:hover{color:var(--ink)}
.picker button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.stage{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;max-height:70vh;background:var(--mat);border-radius:6px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline-offset:-3px}
.stage canvas:active{cursor:grabbing}
.hint,.msg{position:absolute;left:12px;top:12px;font:500 13px/1.3 var(--body);color:var(--on-mat);background:var(--mat-glass);padding:6px 10px;border-radius:999px;pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}
.msg{left:50%;top:50%;transform:translate(-50%,-50%);border-radius:6px;padding:10px 14px;text-align:center;max-width:80%}
.bar{display:block;height:3px;width:160px;max-width:100%;margin-top:8px;background:rgba(234,242,236,.25);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--on-mat)}
.view{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.view button{width:36px;height:36px;border-radius:50%;border:0;background:var(--mat-glass);color:var(--on-mat);cursor:pointer;display:grid;place-items:center;padding:0}
.view button:hover{background:rgba(12,32,24,.82)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.caption{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;min-height:4.6em}
.caption .n{font:600 13px/1.4 var(--body);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.caption h2{font:700 20px/1.25 var(--display);margin:0;min-width:0}
.caption p{grid-column:2;margin:0;color:var(--muted);max-width:65ch;min-width:0}

.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbtn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.tbtn:hover{border-color:var(--muted)}
.tbtn.main{width:48px;height:48px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbtn.main svg.ic{fill:currentColor;stroke:none;width:20px;height:20px}
.track{position:relative;flex:1 1 220px;min-width:0;height:40px;display:flex;align-items:center}
.track input{width:100%;margin:0;accent-color:var(--accent);position:relative;z-index:1}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:14px;transform:translateY(-50%);pointer-events:none}
.ticks i{position:absolute;top:0;width:1px;height:100%;background:var(--muted);opacity:.45}
.time{font:500 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
select{font:500 14px/1 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:9px 12px}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.facts{border-top:1px solid var(--rule);padding-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px;margin:0}
.facts div{min-width:0}
.facts dt{font:600 12px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font:500 16px/1.4 var(--body);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;max-width:72ch;margin:0}
.note b{color:var(--ink);font-weight:600}
@media (max-width:640px){
  .stage{aspect-ratio:1/1;max-height:none}
  .caption{grid-template-columns:1fr}.caption p{grid-column:1}
  .time{order:5}
}
</style>

<main class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">Physics playback</p>
      <h1>Weaving a julehjerte, strip by strip</h1>
    </div>
    <div class="picker" role="tablist" aria-label="Design" id="picker"></div>
  </header>

  <section class="stage" id="stage" aria-label="3D playback">
    <canvas id="cv" tabindex="0" aria-label="Paper heart being woven. Drag to rotate, scroll or pinch to zoom."></canvas>
    <div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · shift-drag to move</div>
    <div class="msg" id="msg">Loading…<span class="bar"><i id="prog"></i></span></div>
    <div class="view">
      <button type="button" id="zout" aria-label="Zoom out" title="Zoom out"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button type="button" id="zin" aria-label="Zoom in" title="Zoom in"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <button type="button" id="zreset" aria-label="Reset view" title="Reset view"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></button>
    </div>
  </section>

  <div class="caption">
    <span class="n" id="capn">&nbsp;</span>
    <h2 id="caph">&nbsp;</h2>
    <p id="capp">&nbsp;</p>
  </div>

  <div class="transport">
    <button type="button" class="tbtn" id="prev" aria-label="Previous step" title="Previous step"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button type="button" class="tbtn main" id="play" aria-label="Play"><svg class="ic" viewBox="0 0 24 24"><path id="playic" d="M8 5v14l11-7z"/></svg></button>
    <button type="button" class="tbtn" id="next" aria-label="Next step" title="Next step"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="track"><div class="ticks" id="ticks"></div><input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Position in the weave"></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>

  <dl class="facts" id="facts"></dl>
  <p class="note" id="note"></p>
</main>

  for(i=0;i<n;i+=6){x=P[i];y=P[i+1];z=P[i+2];wx=e[0]*x+e[4]*y+e[8]*z+e[12];wy=e[1]*x+e[5]*y+e[9]*z+e[13];wz=e[2]*x+e[6]*y+e[10]*z+e[14];
    if(wx<bmin.x)bmin.x=wx;if(wx>bmax.x)bmax.x=wx;if(wy<bmin.y)bmin.y=wy;if(wy>bmax.y)bmax.y=wy;if(wz<bmin.z)bmin.z=wz;if(wz>bmax.z)bmax.z=wz;}
  var hp=handle.pos,he=handle.mesh.matrixWorld.elements,hn=handle.mesh.visible?hp.length:0;   /* the handle counts too once it is there */
  for(i=0;i<hn;i+=12){x=hp[i];y=hp[i+1];z=hp[i+2];wx=he[0]*x+he[4]*y+he[8]*z+he[12];wy=he[1]*x+he[5]*y+he[9]*z+he[13];wz=he[2]*x+he[6]*y+he[10]*z+he[14];
    if(wx<bmin.x)bmin.x=wx;if(wx>bmax.x)bmax.x=wx;if(wy<bmin.y)bmin.y=wy;if(wy>bmax.y)bmax.y=wy;if(wz<bmin.z)bmin.z=wz;if(wz>bmax.z)bmax.z=wz;}
  wantC.addVectors(bmin,bmax).multiplyScalar(0.5);
  var hw=0,hh=0,dep=0;
  for(i=0;i<hn;i+=12){x=hp[i];y=hp[i+1];z=hp[i+2];v3.set(he[0]*x+he[4]*y+he[8]*z+he[12],he[1]*x+he[5]*y+he[9]*z+he[13],he[2]*x+he[6]*y+he[10]*z+he[14]).sub(wantC);
    var a2=Math.abs(v3.dot(right)),b2=Math.abs(v3.dot(upv)),c2=v3.dot(dir);if(a2>hw)hw=a2;if(b2>hh)hh=b2;if(c2>dep)dep=c2;}
  for(i=0;i<n;i+=6){x=P[i];y=P[i+1];z=P[i+2];v3.set(e[0]*x+e[4]*y+e[8]*z+e[12],e[1]*x+e[5]*y+e[9]*z+e[13],e[2]*x+e[6]*y+e[10]*z+e[14]).sub(wantC);
    var a=Math.abs(v3.dot(right)),b=Math.abs(v3.dot(upv)),c=v3.dot(dir);if(a>hw)hw=a;if(b>hh)hh=b;if(c>dep)dep=c;}
  var tv=Math.tan(cam.fov*PI/360),wantD=Math.max(hh/tv,hw/(tv*cam.aspect),1.6/tv)*(1.1+0.22*Math.max(st.sci,st.pen))+dep,moving=false;
  if(!camReady){camC.copy(wantC);camD=wantD;camReady=true;}
  else{var k=1-Math.exp(-dt*3.2);if(camC.distanceTo(wantC)>0.004||Math.abs(camD-wantD)>0.004)moving=true;camC.lerp(wantC,k);camD=lerp(camD,wantD,k);}
  v3.copy(camC).add(pan);cam.position.copy(v3).addScaledVector(dir,camD*zoom);cam.lookAt(v3);cam.updateMatrixWorld();
  sun.target.position.set(camC.x,camC.y,0);sun.position.set(camC.x-5,camC.y-7,13);sun.target.updateMatrixWorld();
  return moving;
}
function caption(){
  var k=stepIndexAt(T);if(k===lastCh)return;lastCh=k;
  $('capn').textContent='Step '+(k+1)+' of '+steps.length;$('caph').textContent=steps[k].t;$('capp').textContent=steps[k].x;
}
/* draw the moment T; dt is how much real time has passed, for the camera's easing (0 = jump) */
function show(dt){if(!B)return false;
  curState=stateAt(T);apply(curState);
  var moving=fitCamera(dt||0,curState);R.render(scene,cam);
  $('scrub').value=String(Math.round(T/TOTAL*1000));$('time').textContent=clock(T)+' / '+clock(TOTAL);caption();
  return moving;}
function resize(){var w=st_.clientWidth,h=st_.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();if(B)show(0);else R.render(scene,cam);}
if(window.ResizeObserver)new ResizeObserver(resize).observe(st_);else window.addEventListener('resize',resize);
resize();

/* ---- transport ---- */
function setPlaying(p){playing=p;$('playic').setAttribute('d',p?'M7 5h4v14H7zM13 5h4v14h-4z':'M8 5v14l11-7z');$('play').setAttribute('aria-label',p?'Pause':'Play');}
function toggle(){if(!B)return;if(T>=TOTAL-1e-3)T=0;setPlaying(!playing);}
function seek(t){if(!B)return;T=clamp(t,0,TOTAL);wake=60;}
function step(d){if(!B)return;var k=stepIndexAt(T);
  if(d<0){k=(T-stepStart[k]>1.2||k===0)?k:k-1;seek(stepStart[k]);}else{seek(k+1<steps.length?stepStart[k+1]:TOTAL);}}
$('play').onclick=toggle;$('prev').onclick=function(){step(-1);};$('next').onclick=function(){step(1);};
$('scrub').oninput=function(e){setPlaying(false);seek(e.target.value/1000*TOTAL);};
$('speed').onchange=function(e){speed=+e.target.value;};
function ticks(){var el=$('ticks');el.textContent='';stepStart.forEach(function(t){if(t<=0||t>=TOTAL)return;var i=document.createElement('i');i.style.left=(t/TOTAL*100)+'%';el.appendChild(i);});}
function facts(){var el=$('facts');el.textContent='';var s=B.stats||{},rows=[['Design',cur.name+' · '+cur.about],['Mesh',B.nv.toLocaleString('en')+' points, '+B.nf.toLocaleString('en')+' triangles'],['Length',clock(TOTAL)+', of which '+clock(tW-tI)+' simulated']];
  if(s.seconds)rows.push(['Time to simulate',Math.round(s.seconds/60)+' min']);
  if(s.magic!==undefined)rows.push(['Passed through by magic',s.magic?(s.magic+(s.magic===1?' strip':' strips')+', in '+Math.round(100*s.magicFrames/Math.max(1,s.simframes))+'% of the weaving'):'None']);
  if(s.bad!==undefined)rows.push(['Paper through paper otherwise',s.bad?(s.bad+' frames'):'Never']);
  if(s.retries)rows.push(['Draws done again by pulling',String(s.retries)]);
  if(s.stretch)rows.push(['Most stretch',s.stretch+'%']);
  rows.forEach(function(r){var d=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=r[0];dd.textContent=r[1];d.appendChild(dt);d.appendChild(dd);el.appendChild(d);});
  $('note').textContent=s.note||'';}

/* ---- looking around ---- */
function nudge(){hint.classList.add('gone');wake=40;}
function zoomBy(k){zoom=clamp(zoom*k,0.18,3);nudge();}
function panBy(dx,dy){var s=2*camD*zoom*Math.tan(cam.fov*PI/360)/st_.clientHeight;pan.addScaledVector(right,-dx*s).addScaledVector(upv,dy*s);pan.clampLength(0,8);nudge();}
function rotBy(dx,dy){yaw-=dx*0.008;tilt=clamp(tilt-dy*0.006,0.03,1.5);nudge();}
var ptrs={},pinch=0,mid=null;
function two(){var k=Object.keys(ptrs);if(k.length<2)return null;var a=ptrs[k[0]],b=ptrs[k[1]];return {d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
cv.addEventListener('pointerdown',function(e){ptrs[e.pointerId]={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2||e.button===1};try{cv.setPointerCapture(e.pointerId);}catch(_){ }var t=two();if(t){pinch=t.d;mid=t;}});
cv.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;var t=two();
  if(t){if(pinch>0&&t.d>0)zoomBy(pinch/t.d);panBy(t.x-mid.x,t.y-mid.y);pinch=t.d;mid=t;}else if(p.pan)panBy(dx,dy);else rotBy(dx,dy);});
function up(e){delete ptrs[e.pointerId];pinch=0;mid=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){e.preventDefault();zoomBy(Math.exp((e.deltaMode===1?e.deltaY*16:e.deltaY)*(e.ctrlKey?0.01:0.0015)));},{passive:false});
function resetView(){yaw=YAW0;tilt=TILT0;zoom=1;pan.set(0,0,0);nudge();}
cv.addEventListener('dblclick',resetView);
$('zin').onclick=function(){zoomBy(0.8);};$('zout').onclick=function(){zoomBy(1.25);};$('zreset').onclick=resetView;
cv.addEventListener('keydown',function(e){var k=e.key,used=true;
  if(k==='ArrowLeft')rotBy(12,0);else if(k==='ArrowRight')rotBy(-12,0);else if(k==='ArrowUp')rotBy(0,12);else if(k==='ArrowDown')rotBy(0,-12);
  else if(k==='+'||k==='=')zoomBy(0.87);else if(k==='-'||k==='_')zoomBy(1.15);else if(k==='0')resetView();else used=false;if(used)e.preventDefault();});
window.addEventListener('keydown',function(e){if(e.key!==' ')return;var t=e.target.tagName;if(t==='BUTTON'||t==='SELECT'||t==='INPUT'||t==='A')return;e.preventDefault();toggle();});

/* ---- loop: draw only while playing, while the camera is still settling, or just after the view changed ---- */
var last=0;function loop(now){var dt=Math.min(0.1,(now-last)/1000||0);last=now;
  if(B){if(playing){T+=dt*speed;if(T>=TOTAL){T=TOTAL;setPlaying(false);wake=60;}show(dt);}else if(wake>0){wake--;if(show(dt)&&wake<2)wake=2;}}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---- choosing a design ---- */
var pk=$('picker'),sel=null;
function tabs(){pk.textContent='';
  if(DESIGNS.length>5){pk.removeAttribute('role');pk.className='';sel=document.createElement('select');sel.id='design';sel.setAttribute('aria-label','Design');
    DESIGNS.forEach(function(d,i){var o=document.createElement('option');o.value=String(i);o.textContent=d.name;sel.appendChild(o);});sel.onchange=function(){pick(DESIGNS[+sel.value],true);};pk.appendChild(sel);return;}
  DESIGNS.forEach(function(d){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=d.name;b.id='tab-'+d.id;b.onclick=function(){pick(d,true);};pk.appendChild(b);});}
function pick(d,setHash){if(cur===d&&B)return;cur=d;setPlaying(false);if(sel)sel.value=String(DESIGNS.indexOf(d));else DESIGNS.forEach(function(x){$('tab-'+x.id).setAttribute('aria-selected',x===d?'true':'false');});
  if(setHash){try{location.hash=d.id;}catch(_){ }}
  var id=++loadId;clear();pencil.visible=false;scis.visible=false;handle.mesh.visible=false;R.render(scene,cam);say('Loading '+d.name+'…',true);$('capn').textContent=d.name;$('caph').textContent='Loading…';$('capp').textContent=d.about;
  if(!window.DecompressionStream){say('This browser is too old to unpack the recording.');return;}
  var got=cache[d.id]?Promise.resolve(cache[d.id]):fetchBuf(d.file,function(p){var el=$('prog');if(el&&id===loadId)el.style.width=(p*100)+'%';}).then(function(b){cache[d.id]=b;return b;});
  got.then(parse).then(function(hd){if(id!==loadId)return;say('');build(hd);}).catch(function(err){if(id===loadId)say('Could not load '+d.name+'.');if(window.console)console.error(err);});}
function fromHash(){var h=(location.hash||'').slice(1),d=DESIGNS.filter(function(x){return x.id===h;})[0];pick(d||DESIGNS[0],false);}
function start(){if(!DESIGNS.length){say('No designs listed.');return;}tabs();window.addEventListener('hashchange',fromHash);fromHash();}
/* with an empty list above, the designs are read from designs.json next to the page: [{"id":…,"name":…,"file":…,"about":…}, …] */
if(DESIGNS.length)start();else fetch('designs.json').then(function(r){return r.json();}).then(function(j){DESIGNS=j;start();}).catch(function(){say('Could not read designs.json.');});

/* for play.py and tests: stills and video */
window.__p={ready:function(){return !!B;},total:total,starts:function(){return stepStart.slice();},weave:function(){return [tI,tW];},
  set:function(t,settle){T=clamp(t,0,TOTAL);if(settle)camReady=false;show(0);},step:function(t,dt){T=clamp(t,0,TOTAL);show(dt);},view:function(y,tl,z){yaw=y;tilt=tl;zoom=z||1;camReady=false;show(0);}};
})();
</script>
